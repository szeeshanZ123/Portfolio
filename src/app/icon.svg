<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .zs-stroke { stroke: #10B981; }
    .zs-fill { fill: #10B981; }
    .zs-bg { fill: #050505; }
    @media (prefers-color-scheme: light) {
      .zs-stroke { stroke: #059669; }
      .zs-fill { fill: #059669; }
      .zs-bg { fill: #FFFFFF; }
    }
  </style>
  <rect width="100" height="100" rx="22" class="zs-bg" />
  <!-- Hexagonal Tech Node Frame -->
  <path
    class="zs-stroke"
    d="M50 14 L82 32 L82 68 L50 86 L18 68 L18 32 Z"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />
  <!-- Elegant ZS Geometry -->
  <path
    class="zs-stroke"
    d="M34 36 L66 36 L36 64 L68 64"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Data node vertex -->
  <circle cx="50" cy="50" r="3.5" class="zs-fill" />
</svg>
